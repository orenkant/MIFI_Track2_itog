name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Линтинг (flake8, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Установка линтеров
        run: pip install flake8==7.5.0 black==26.10.1

      - name: flake8
        run: flake8 src tests

      - name: black
        run: black --check --diff src tests

  test:
    name: Валидация данных и тесты
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      # полный датасет хранится в DVC, в репозитории лежит выборка из 1000 строк
      - name: Валидация данных (Great Expectations)
        run: python -m src.data.validation tests/data/sample.csv --report reports/ci_validation_report.json

      - name: Unit-тесты (pytest)
        run: pytest -v

      - name: Отчёт валидации
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: reports/ci_validation_report.json
          if-no-files-found: ignore
