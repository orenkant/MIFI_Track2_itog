          random_state: 42
          n_jobs: -1
          mlflow:
            tracking_uri: sqlite:///mlflow.db
            experiment_name: credit_default_pd
            registered_model_name: CreditDefaultModel
          experiments:
          - name: logreg_baseline
            model: logreg
            use_features: false
            search: grid
            params:
              solver: liblinear
            param_grid:
              C:
              - 0.01
              - 0.1
              - 1.0
              l1_ratio:
              - 0
              - 1
              class_weight:
              - 
