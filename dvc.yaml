stages:
  # если данные не прошли проверки GE, стадия падает и дальше пайплайн не идёт
  validate:
    cmd: python -m src.data.validation data/raw/UCI_Credit_Card.csv --report reports/validation_report.json
    deps:
      - data/raw/UCI_Credit_Card.csv
      - src/data/columns.py
      - src/data/validation.py
    outs:
      - reports/validation_report.json:
          cache: false
      - data/expectations/credit_data_suite.json:
          cache: false

  prepare:
    cmd: python -m src.data.make_dataset
    # отчёт валидации в зависимостях, чтобы prepare шёл только после validate
    deps:
      - data/raw/UCI_Credit_Card.csv
      - reports/validation_report.json
      - src/data/columns.py
      - src/data/make_dataset.py
    params:
      - data
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python -m src.models.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/data/columns.py
      - src/features/build_features.py
      - src/models/pipeline.py
      - src/models/metrics.py
      - src/models/train.py
    params:
      - train
    outs:
      - models/model.pkl
      - models/model_meta.json:
          cache: false
      - reports/experiments.csv:
          cache: false
    metrics:
      - metrics.json:
          cache: false
    plots:
      - reports/figures/roc_curve.png:
          cache: false
      - reports/figures/roc_curves_all.png:
          cache: false
      - reports/figures/confusion_matrix.png:
          cache: false
