data:
  raw_path: data/raw/UCI_Credit_Card.csv
  processed_dir: data/processed
  test_size: 0.2
  random_state: 42

train:
  cv_folds: 5
  random_state: 42
  n_jobs: -1
  mlflow:
    tracking_uri: sqlite:///mlflow.db
    experiment_name: credit_default_pd
    registered_model_name: CreditDefaultModel

  # каждый эксперимент = отдельный run в MLflow
  experiments:
    - name: logreg_baseline
      model: logreg
      use_features: false
      search: grid
      params:
        solver: liblinear
      param_grid:
        C: [0.01, 0.1, 1.0]
        l1_ratio: [0, 1]
        class_weight: [null, balanced]

    - name: logreg_fe
      model: logreg
      use_features: true
      search: grid
      params:
        solver: liblinear
      param_grid:
        C: [0.01, 0.1, 1.0]
        l1_ratio: [0, 1]
        class_weight: [null, balanced]

    - name: random_forest
      model: random_forest
      use_features: true
      search: random
      n_iter: 8
      params:
        n_jobs: 1
      param_grid:
        n_estimators: [200, 400]
        max_depth: [6, 8, 10, 12]
        min_samples_leaf: [5, 10, 20]
        max_features: [sqrt, 0.3]
        class_weight: [null, balanced_subsample]

    - name: gradient_boosting
      model: gradient_boosting
      use_features: true
      search: random
      n_iter: 6
      params: {}
      param_grid:
        n_estimators: [100, 200]
        learning_rate: [0.05, 0.1]
        max_depth: [2, 3, 4]
        subsample: [0.8, 1.0]

    - name: hist_gradient_boosting
      model: hist_gradient_boosting
      use_features: true
      search: random
      n_iter: 15
      params: {}
      param_grid:
        learning_rate: [0.03, 0.05, 0.1]
        max_iter: [200, 400]
        max_leaf_nodes: [15, 31]
        min_samples_leaf: [20, 50, 100]
        l2_regularization: [0.0, 1.0]
